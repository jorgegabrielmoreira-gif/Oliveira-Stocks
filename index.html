<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Gestão de Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- SECÇÃO DE LOGIN -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-100">
            <h2 class="text-2xl font-bold text-center mb-6 text-slate-700">Gestão de Stock</h2>
            <form id="form-login" onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Palavra-passe</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="">
                </div>
                <div id="login-erro" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100">
                    Dados de acesso incorretos.
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Entrar
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-slate-500 bg-slate-50 p-3 rounded-lg">
                ⚠️ O acesso é restrito. As contas são criadas apenas pela Administração.
            </div>
        </div>
    </div>

    <!-- SECÇÃO DE ADMINISTRAÇÃO (Oculta por defeito) -->
    <div id="admin-section" class="hidden min-h-screen flex bg-slate-100">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-800 text-white p-6 flex flex-col">
            <h2 class="text-xl font-bold mb-8 flex items-center">🛡️ Painel Admin</h2>
            <nav class="flex-1 space-y-2">
                <a href="#" class="block px-4 py-2 bg-blue-600 rounded-lg">Gestão de Utilizadores</a>
                <!-- LIGAÇÃO PARA A APP DE STOCK -->
                <a href="app.html" class="block px-4 py-2 hover:bg-slate-700 rounded-lg mt-4 text-emerald-400 font-medium">📦 Abrir App de Stock</a>
            </nav>
            <button onclick="fazerLogout()" class="mt-auto px-4 py-2 bg-slate-700 hover:bg-red-600 rounded-lg text-left transition-colors flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> Sair (Logout)</button>
        </div>

        <!-- Conteúdo Admin -->
        <div class="flex-1 p-8">
            <h1 class="text-2xl font-bold mb-6 text-slate-800">Gerir Acessos</h1>
            
            <!-- Formulário Novo / Editar Utilizador -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="form-titulo" class="text-lg font-semibold text-slate-800">Criar Novo Utilizador</h3>
                    <button type="button" id="btn-cancelar-edicao" onclick="cancelarEdicao()" class="hidden text-sm text-slate-500 hover:text-slate-800 bg-slate-100 px-3 py-1 rounded-lg transition-colors">Cancelar Edição</button>
                </div>

                <form id="form-novo-utilizador" onsubmit="guardarUtilizador(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <input type="hidden" id="edit-id" value="">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nome</label>
                        <input type="text" id="novo-nome" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
                        <input type="email" id="novo-email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                        <input type="text" id="novo-password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button type="submit" id="btn-guardar" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                        + Adicionar
                    </button>
                </form>
            </div>

            <!-- Lista de Utilizadores -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200">
                            <th class="px-6 py-3 text-sm font-semibold text-slate-600">Nome</th>
                            <th class="px-6 py-3 text-sm font-semibold text-slate-600">Email</th>
                            <th class="px-6 py-3 text-sm font-semibold text-slate-600 text-center">Cargo</th>
                            <th class="px-6 py-3 text-sm font-semibold text-slate-600 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-utilizadores" class="divide-y divide-slate-100">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Configurações
        const DB_KEY = 'stockAppUsers';
        const SESSION_KEY = 'stockAppCurrentSession';

        // Inicializar Base de Dados
        function initDB() {
            let users = JSON.parse(localStorage.getItem(DB_KEY));
            if (!users || users.length === 0) {
                users = [{
                    id: 1, name: "Administrador Principal", email: "admin@empresa.com",
                    password: "admin123", role: "Administrador"
                }];
                localStorage.setItem(DB_KEY, JSON.stringify(users));
            }
        }

        // Verificar Sessão ao carregar a página
        function verificarSessao() {
            const sessao = JSON.parse(localStorage.getItem(SESSION_KEY));
            if (sessao) {
                if (sessao.role === 'Administrador') {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('admin-section').classList.remove('hidden');
                    atualizarTabela();
                } else {
                    window.location.href = "app.html";
                }
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        }

        // Função de Login
        function fazerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const erro = document.getElementById('login-erro');
            
            const users = JSON.parse(localStorage.getItem(DB_KEY));
            const userEncontrado = users.find(u => u.email === email && u.password === pass);

            if (userEncontrado) {
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    nome: userEncontrado.name,
                    email: userEncontrado.email,
                    role: userEncontrado.role
                }));
                erro.classList.add('hidden');
                verificarSessao();
            } else {
                erro.classList.remove('hidden');
            }
        }

        // Função de Logout
        function fazerLogout() {
            localStorage.removeItem(SESSION_KEY);
            window.location.reload();
        }

        // --- Funções do Admin ---
        function atualizarTabela() {
            const users = JSON.parse(localStorage.getItem(DB_KEY));
            const tbody = document.getElementById('tabela-utilizadores');
            tbody.innerHTML = '';
            
            users.forEach(u => {
                const isMainAdmin = u.id === 1 || u.email === 'admin@empresa.com';
                const badgeClass = u.role === 'Administrador' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700';
                
                const btnEliminarHtml = isMainAdmin 
                    ? `<button disabled class="p-1.5 text-slate-300 cursor-not-allowed" title="Não é possível eliminar a conta principal"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`
                    : `<button onclick="eliminarUtilizador(${u.id})" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-4 font-medium text-slate-900">${u.name}</td>
                        <td class="px-6 py-4 text-slate-600">${u.email}</td>
                        <td class="px-6 py-4 text-center"><span class="px-2.5 py-1 text-xs font-semibold rounded-full ${badgeClass}">${u.role}</span></td>
                        <td class="px-6 py-4 text-center flex justify-center space-x-2">
                            <button onclick="prepararEdicao(${u.id})" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition" title="Editar"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            ${btnEliminarHtml}
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        function guardarUtilizador(e) {
            e.preventDefault();
            const users = JSON.parse(localStorage.getItem(DB_KEY));
            const editId = document.getElementById('edit-id').value;
            
            const nome = document.getElementById('novo-nome').value;
            const email = document.getElementById('novo-email').value;
            const password = document.getElementById('novo-password').value;

            if (editId) {
                // Editar existente
                const index = users.findIndex(u => u.id == editId);
                if (index !== -1) {
                    if (users.find(u => u.email === email && u.id != editId)) {
                        alert("Este email já está registado por outro utilizador!");
                        return;
                    }
                    users[index].name = nome;
                    users[index].email = email;
                    users[index].password = password;
                }
            } else {
                // Criar novo
                if(users.find(u => u.email === email)) {
                    alert("Este email já está registado!");
                    return;
                }
                users.push({
                    id: Date.now(),
                    name: nome,
                    email: email,
                    password: password,
                    role: 'Operador'
                });
            }

            localStorage.setItem(DB_KEY, JSON.stringify(users));
            cancelarEdicao();
            atualizarTabela();
        }

        function prepararEdicao(id) {
            const users = JSON.parse(localStorage.getItem(DB_KEY));
            const user = users.find(u => u.id == id);
            
            if (user) {
                document.getElementById('edit-id').value = user.id;
                document.getElementById('novo-nome').value = user.name;
                document.getElementById('novo-email').value = user.email;
                document.getElementById('novo-password').value = user.password;
                
                document.getElementById('form-titulo').textContent = "Editar Utilizador";
                const btn = document.getElementById('btn-guardar');
                btn.textContent = "Atualizar Dados";
                btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                
                document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
                document.getElementById('form-novo-utilizador').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function cancelarEdicao() {
            document.getElementById('form-novo-utilizador').reset();
            document.getElementById('edit-id').value = "";
            
            document.getElementById('form-titulo').textContent = "Criar Novo Utilizador";
            const btn = document.getElementById('btn-guardar');
            btn.textContent = "+ Adicionar";
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
            
            document.getElementById('btn-cancelar-edicao').classList.add('hidden');
        }

        function eliminarUtilizador(id) {
            if(confirm("Tem a certeza que deseja eliminar este utilizador?")) {
                let users = JSON.parse(localStorage.getItem(DB_KEY));
                users = users.filter(u => u.id != id);
                localStorage.setItem(DB_KEY, JSON.stringify(users));
                
                if (document.getElementById('edit-id').value == id) {
                    cancelarEdicao();
                }
                atualizarTabela();
            }
        }

        // Iniciar
        initDB();
        verificarSessao();
        lucide.createIcons();
    </script>
</body>
</html>
