name: Backup Semanal CSV

on:
  schedule:
  - cron: '0 3 * * *'
  workflow_dispatch:

# Este repositório é só de leitura: os backups vão para um repositório PRIVADO à parte
permissions:
  contents: read

jobs:
  fazer-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar biblioteca do Supabase
        run: npm install @supabase/supabase-js

      - name: Executar o script de Backup CSV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node gerar_backup.js

      - name: Guardar os CSV no repositório privado de backups
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${OWNER}/Oliveira-Stocks-Backups.git" destino
          mkdir -p destino/backups
          cp backups/*.csv destino/backups/
                   cd destino
          LIMITE=$(date -d '60 days ago' +%F)
          for f in backups/*_????-??-??.csv; do
            d="${f##*_}"; d="${d%.csv}"
            if [[ "$d" < "$LIMITE" ]]; then git rm -q "$f"; fi
          done
          git config user.name "Backup Automático"
          git config user.email "backup@users.noreply.github.com"
          git add backups/
          git commit -m "Backup semanal $(date +%F)" || echo "Sem alterações"
          git push
